name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'porsikecil-android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project dari zip
        run: |
          set -e
          ls -la
          unzip -q porsikecil-android.zip -d project
          SRC=$(dirname "$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)")
          echo "Project ditemukan di: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Setujui lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        working-directory: ${{ env.SRC }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: PorsiKecil-debug-apk
          path: ${{ env.SRC }}/app/build/outputs/apk/debug/*.apk
