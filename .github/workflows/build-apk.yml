name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip terbaru
        run: |
          ZIP=$(ls -t porsikecil-android*.zip | head -1)
          echo "Memakai $ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          ls project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Tes unit
        working-directory: project
        run: gradle test --stacktrace

      - name: Build APK debug
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Unggah laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: project/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: PorsiKecil-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
